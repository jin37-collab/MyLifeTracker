name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        working-directory: MyLifeTracker
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: MyLifeTracker
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeTracker-debug-apk
          path: MyLifeTracker/app/build/outputs/apk/debug/app-debug.apk
